<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEKOLAHKU - PORTAL UTAMA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; color: #1e293b; }
        header { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: white; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .header-title h1 { font-size: 20px; font-weight: 800; tracking: 1px; color: #ffffff; }
        .header-title p { font-size: 11px; color: #a5b4fc; font-weight: 600; text-transform: uppercase; margin-top: 2px; }
        .wrapper { display: flex; flex: 1; }
        aside { width: 260px; background-color: #0f172a; padding: 20px 10px; display: flex; flex-direction: column; gap: 4px; }
        .menu-btn { width: 100%; border: none; padding: 12px 16px; border-radius: 12px; font-size: 12px; font-weight: 700; text-align: left; background: transparent; color: #94a3b8; cursor: pointer; transition: all 0.2s; }
        .menu-btn:hover { background-color: #1e293b; color: white; }
        .menu-btn.active { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); color: white; }
        main { flex: 1; padding: 30px; }
        .welcome-card { background: linear-gradient(135deg, #1e3a8a 0%, #1e1b4b 100%); padding: 24px; border-radius: 20px; color: white; margin-bottom: 24px; }
        .welcome-card h2 { font-size: 22px; font-weight: 800; }
        .welcome-card p { font-size: 12px; color: #bfdbfe; margin-top: 4px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
        
        /* STRUKTUR KARTU INTERAKTIF */
        .card { background-color: white; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; transition: all 0.3s; }
        .card:hover { transform: translateY(-3px); border-color: #4f46e5; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
        .card-icon { font-size: 36px; line-height: 1; padding: 5px; }
        .card-info { text-align: right; }
        .card-value { font-size: 26px; font-weight: 800; color: #0f172a; }
        .card-label { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-top: 2px; }
        .card-action { width: 100%; border: none; border-top: 1px solid #f1f5f9; padding-top: 12px; background: transparent; color: #4f46e5; font-size: 11px; font-weight: 700; text-align: left; margin-top: 15px; cursor: pointer; }
        
        .modal { display: none; position: fixed; inset: 0; background-color: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background-color: white; width: 100%; max-width: 600px; border-radius: 20px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .modal-content-wrapper { display: flex; flex-direction: column; width: 100%; }
        .modal-header { display: flex; justify-content: space-between; font-weight: 800; margin-bottom: 15px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }
        .modal-header h3 { font-size: 16px; font-weight: 800; color: #0f172a; }
        .close-modal { cursor: pointer; background: transparent; border: none; font-size: 24px; font-weight: bold; color: #94a3b8; }
        .close-modal:hover { color: #e11d48; }
        .modal-body { max-height: 350px; overflow-y: auto; font-size: 13px; color: #334155; }
        .detail-row { display: flex; border-bottom: 1px solid #f1f5f9; padding: 10px 0; justify-content: space-between; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>SEKOLAHKU</h1>
            <p>SMP SUNAN KALIJOGO 2 JABUNG</p>
        </div>
    </header>

    <div class="wrapper">
        <aside>
            <button class="menu-btn active">DASHBOARD</button>
            <button class="menu-btn" onclick="openProfilModal()">DATA SEKOLAH</button>
            <button class="menu-btn">ABSENSI KBM</button>
            <button class="menu-btn">CATATAN TATIB</button>
            <button class="menu-btn">PENILAIAN</button>
            <button class="menu-btn">JURNAL GURU</button>
            <button class="menu-btn">PERANGKAT</button>
        </aside>

        <main>
            <div class="welcome-card">
                <h2>Selamat Datang</h2>
                <p>Sistem Data Sekolah Terintegrasi</p>
            </div>

            <div class="grid-container">
                
                <!-- KOTAK 1: PROFIL SEKOLAH (GAMBAR GEDUNG SEKOLAH 🏫) -->
                <div class="card" onclick="openProfilModal()">
                    <div class="card-top">
                        <div class="card-icon">🏫</div>
                        <div class="card-info">
                            <div class="card-value">01</div>
                            <div class="card-label">Profil Sekolah</div>
                        </div>
                    </div>
                    <button class="card-action">Akses Detail ➔</button>
                </div>
                
                <!-- KOTAK 2: TOTAL ROMBEL (GAMBAR GRAFIK DATA 📊) -->
                <div class="card" onclick="openRombelModal()">
                    <div class="card-top">
                        <div class="card-icon">📊</div>
                        <div class="card-info">
                            <div class="card-value" id="box-rombel">19</div>
                            <div class="card-label">Total Rombel</div>
                        </div>
                    </div>
                    <button class="card-action">Akses Detail ➔</button>
                </div>
                
                <!-- KOTAK 3: DATABASE GURU (GAMBAR GURU MENGAJAR 👨‍🏫) -->
                <div class="card" onclick="openGuruModal()">
                    <div class="card-top">
                        <div class="card-icon">👨‍🏫</div>
                        <div class="card-info">
                            <div class="card-value" id="box-guru">33</div>
                            <div class="card-label">Database Guru</div>
                        </div>
                    </div>
                    <button class="card-action">Akses Detail ➔</button>
                </div>
                
                <!-- KOTAK 4: SISWA AKTIF (GAMBAR TOPI TOGA 🎓) -->
                <div class="card" onclick="openSiswaModal()">
                    <div class="card-top">
                        <div class="card-icon">🎓</div>
                        <div class="card-info">
                            <div class="card-value" id="box-siswa">427</div>
                            <div class="card-label">Siswa Aktif (A/MM)</div>
                        </div>
                    </div>
                    <button class="card-action">Akses Detail ➔</button>
                </div>
                
            </div>
            <footer style="border-top: 1px solid #e2e8f0; padding-top: 16px; margin-top: 40px; font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">&copy; 2026 SMP SUNAN KALIJOGO 2 JABUNG • ALL RIGHTS RESERVED</footer>
        </main>
    </div>

    <div id="dataModal" class="modal">
        <div class="modal-content">
            <div class="modal-content-wrapper">
                <div class="modal-header">
                    <h3 id="modalTitle">Detail Data</h3>
                    <button class="close-modal" onclick="closeModal()">×</button>
                </div>
                <div class="modal-body" id="modalBody">Memuat data riil...</div>
            </div>
        </div>
    </div>

    <script>
        const WEB_API_URL = "https://google.com"; 
        let databaseSekolah = { totalRombel: 19, totalGuru: 33, totalSiswa: 427, siswaDetail: [] };

        async function muatDataOtomatis() {
            try {
                const respon = await fetch(WEB_API_URL + "?action=getAllDashboardData");
                const textData = await respon.text();
                const cleanText = textData.replace(/<\/?[^>]+(>|$)/g, "");
                const data = JSON.parse(cleanText);
                databaseSekolah = data;
                
                document.getElementById('box-rombel').innerText = data.totalRombel || "19";
                document.getElementById('box-guru').innerText = data.totalGuru || "33";
                document.getElementById('box-siswa').innerText = data.totalSiswa || "427";
            } catch (e) {
                console.error(e);
            }
        }

        function openProfilModal() {
            document.getElementById('modalTitle').innerText = "PROFIL SEKOLAH MASTER";
            document.getElementById('modalBody').innerHTML = `
                <div class="detail-row"><b>Nama Sekolah</b><span>SMP SUNAN KALIJOGO 2 JABUNG</span></div>
                <div class="detail-row"><b>Tahun Pelajaran</b><span>2026/2027</span></div>
                <div class="detail-row"><b>Kepala Sekolah</b><span>MUHAMMAD MULYONO, S.E</span></div>
                <div class="detail-row"><b>Tatib Sekolah</b><span>SITI FATHONAH, S.Si</span></div>
                <div class="detail-row"><b>Lokasi/Tempat</b><span>Jabung</span></div>
            `;
            document.getElementById('dataModal').style.display = 'flex';
        }

        function openRombelModal() {
            document.getElementById('modalTitle').innerText = "DAFTAR ROMBEL AKTIF";
