<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sekolahku - Absensi</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f1f5f9; color: #1e293b; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-family: inherit; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-success { background: #22c55e; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        select, input[type="date"] { width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; font-family: inherit; margin-top: 4px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { background: #f8fafc; padding: 10px; text-align: left; border-bottom: 2px solid #e2e8f0; }
        td { padding: 8px; border-bottom: 1px solid #e2e8f0; }
        .absensi-btn { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #e2e8f0; background: white; cursor: pointer; font-weight: bold; }
        .absensi-btn.active-s { background: #fef3c7; border-color: #f59e0b; }
        .absensi-btn.active-i { background: #dbeafe; border-color: #3b82f6; }
        .absensi-btn.active-a { background: #fecaca; border-color: #ef4444; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #1e293b; color: white; padding: 12px 24px; border-radius: 10px; display: none; z-index: 999; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="color:#2563eb;">📚 Sekolahku</h1>
        <p style="color:#64748b;">Sistem Absensi Online</p>
        <hr style="margin: 16px 0;">

        <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px;">
            <button class="btn btn-primary" onclick="loadPage('absensi')"><i class="fas fa-clipboard-check"></i> Absensi</button>
            <button class="btn btn-primary" onclick="loadPage('data-sekolah')"><i class="fas fa-database"></i> Data Sekolah</button>
        </div>

        <div class="card" style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;">
            <span>Status: <strong id="statusText">Online</strong></span>
            <span>Data: <strong id="syncStatus">Memuat...</strong></span>
            <span>Update: <strong id="lastUpdate">-</strong></span>
            <button class="btn btn-primary" onclick="refreshData()"><i class="fas fa-sync"></i> Refresh</button>
        </div>

        <div id="pageContent">
            <div class="card" style="text-align:center; color:#64748b;"><p>Silakan pilih menu di atas</p></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================
        // KONFIGURASI - URL Web App TERBARU
        // ============================================
        const CONFIG = {
            API_URL: 'https://script.google.com/macros/s/AKfycbyQMJQv7ksi35Kls8v94stj9TcvpDWVrcBmbRDK2g657R2UyLM7uGLMzDRtGy2Cw8Q1LQ/exec'
        };

        let appData = { profil: {}, rombel: [], siswa: [] };

        function showToast(msg, type = 'info') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.background = type === 'success' ? '#22c55e' : type === 'error' ? '#ef4444' : '#1e293b';
            t.style.display = 'block';
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.style.display = 'none', 3000);
        }

        async function fetchData() {
            try {
                document.getElementById('syncStatus').textContent = 'Memuat...';
                const res = await fetch(`${CONFIG.API_URL}?action=getAllDashboardData`);
                if (!res.ok) throw new Error('Gagal fetch data');
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                appData = data;
                document.getElementById('syncStatus').textContent = '✅ Tersinkron';
                document.getElementById('lastUpdate').textContent = data.statistik?.lastUpdate || new Date().toLocaleString('id-ID');
                showToast('Data berhasil dimuat', 'success');
            } catch (e) {
                document.getElementById('syncStatus').textContent = '❌ Gagal';
                showToast('Error: ' + e.message, 'error');
                console.error(e);
            }
        }

        function refreshData() { fetchData(); }

        function loadPage(page) {
            const container = document.getElementById('pageContent');
            if (page === 'data-sekolah') {
                const { profil, rombel, statistik } = appData;
                container.innerHTML = `
                    <div class="card"><h3>🏫 Profil Sekolah</h3><p><strong>Nama:</strong> ${profil.namaSekolah || '-'}</p><p><strong>Tahun Pelajaran:</strong> ${profil.tahunPelajaran || '-'}</p><p><strong>Kepala Sekolah:</strong> ${profil.kepalaSekolah || '-'}</p></div>
                    <div class="card"><h3>📊 Statistik</h3><p>Total Rombel: <strong>${statistik?.totalRombel || 0}</strong></p><p>Total Siswa: <strong>${statistik?.totalSiswa || 0}</strong></p><p>Update: ${statistik?.lastUpdate || '-'}</p></div>
                    <div class="card"><h3>📋 Daftar Rombel</h3><table><tr><th>No</th><th>Wali Kelas</th><th>Rombel</th></tr>${rombel.map((r,i) => `<tr><td>${i+1}</td><td>${r.wali || '-'}</td><td><strong>${r.rombel || '-'}</strong></td></tr>`).join('')}${rombel.length === 0 ? '<tr><td colspan="3">Belum ada data</td></tr>' : ''}</table></div>
                `;
            } else if (page === 'absensi') {
                renderAbsensi(container);
            }
        }

        function renderAbsensi(container) {
            const rombel = appData.rombel || [];
            let options = '<option value="">Pilih Rombel</option>';
            rombel.forEach(r => options += `<option value="${r.rombel}">${r.rombel} - ${r.wali || ''}</option>`);
            if (rombel.length === 0) options += '<option value="">Belum ada data</option>';

            container.innerHTML = `
                <div class="grid-2">
                    <div class="card">
                        <h3>✏️ Absensi Harian</h3>
                        <div style="display:grid; gap:12px;">
                            <div><label>📅 Tanggal</label><input type="date" id="absensiDate"></div>
                            <div><label>🏫 Rombel</label><select id="absensiRombel">${options}</select></div>
                            <button class="btn btn-primary" onclick="loadAbsensi()"><i class="fas fa-search"></i> Tampilkan Siswa</button>
                        </div>
                        <div id="absensiList" style="margin-top:16px;"><p style="color:#64748b; text-align:center;">Pilih tanggal dan rombel</p></div>
                    </div>
                    <div class="card">
                        <h3>📄 Laporan Absensi</h3>
                        <p style="color:#64748b;">Pilih jenis laporan</p>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px;">
                            <button class="btn btn-primary" onclick="showReport('harian')">Harian</button>
                            <button class="btn btn-primary" onclick="showReport('mingguan')">Mingguan</button>
                            <button class="btn btn-primary" onclick="showReport('bulanan')">Bulanan</button>
                            <button class="btn btn-primary" onclick="showReport('semester')">Semester</button>
                        </div>
                        <button class="btn btn-primary" style="width:100%; margin-top:8px;" onclick="showReport('tahunan')">Tahunan</button>
                        <div id="reportPreview" style="margin-top:16px; background:#f8fafc; padding:16px; border-radius:8px; min-height:50px; color:#64748b; text-align:center;">Pilih jenis laporan</div>
                    </div>
                </div>
            `;
        }

        function loadAbsensi() {
            const date = document.getElementById('absensiDate').value;
            const rombel = document.getElementById('absensiRombel').value;
            if (!date || !rombel) { showToast('Pilih tanggal dan rombel!', 'error'); return; }

            const container = document.getElementById('absensiList');
            const filtered = appData.siswa.filter(s => s.rombel === rombel);
            if (filtered.length === 0) { container.innerHTML = `<p style="color:#64748b; text-align:center;">Tidak ada siswa di ${rombel}</p>`; return; }

            let html = `<table><tr><th>No</th><th>Nama</th><th>S</th><th>I</th><th>A</th><th>Ket</th></tr>`;
            filtered.forEach((s, i) => {
                html += `<tr><td>${i+1}</td><td>${s.nama || '-'}</td><td><button class="absensi-btn" onclick="setStatus(${i},'S')" id="btn-${i}-S">S</button></td><td><button class="absensi-btn" onclick="setStatus(${i},'I')" id="btn-${i}-I">I</button></td><td><button class="absensi-btn" onclick="setStatus(${i},'A')" id="btn-${i}-A">A</button></td><td>${s.ket || '-'}</td></tr>`;
            });
            html += `</table><div style="margin-top:12px; display:flex; gap:12px;"><button class="btn btn-success" onclick="saveAbsensi()"><i class="fas fa-save"></i> Simpan</button><button class="btn btn-danger" onclick="resetAbsensi()"><i class="fas fa-undo"></i> Reset</button></div><p style="font-size:12px; color:#64748b; margin-top:8px;">🟡 S=Sakit 🔵 I=Izin 🔴 A=Alfa ⚪ Kosong=Hadir</p>`;
            container.innerHTML = html;
        }

        function setStatus(index, status) {
            ['S','I','A'].forEach(s => { const btn = document.getElementById(`btn-${index}-${s}`); if (btn) btn.className = 'absensi-btn'; });
            const btn = document.getElementById(`btn-${index}-${status}`);
            if (btn) btn.classList.add(`active-${status.toLowerCase()}`);
        }

        function resetAbsensi() {
            document.querySelectorAll('.absensi-btn').forEach(b => b.className = 'absensi-btn');
            showToast('Reset berhasil', 'success');
        }

        async function saveAbsensi() {
            const tanggal = document.getElementById('absensiDate').value;
            const rombel = document.getElementById('absensiRombel').value;
            if (!tanggal || !rombel) { showToast('Pilih tanggal dan rombel!', 'error'); return; }

            const siswaData = [];
            document.querySelectorAll('#absensiList tbody tr').forEach((row, idx) => {
                let status = 'H';
                ['S','I','A'].forEach(s => {
                    const btn = document.getElementById(`btn-${idx}-${s}`);
                    if (btn && btn.classList.contains(`active-${s.toLowerCase()}`)) status = s;
                });
                siswaData.push({ rowIndex: idx, status });
            });

            try {
                const res = await fetch(CONFIG.API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'saveAbsensi', tanggal, rombel, data: siswaData })
                });
                const result = await res.json();
                if (result.success) {
                    showToast('✅ ' + result.message, 'success');
                    resetAbsensi();
                } else {
                    showToast('❌ ' + result.error, 'error');
                }
            } catch (e) {
                showToast('❌ Gagal menyimpan: ' + e.message, 'error');
            }
        }

        function showReport(type) {
            document.getElementById('reportPreview').innerHTML = `<p style="font-weight:600; color:#2563eb;">📊 Laporan ${type}</p><p>Fitur laporan ${type} akan segera hadir</p><button class="btn btn-primary" onclick="showToast('Fitur cetak segera hadir','info')">🖨️ Cetak</button>`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchData();
            const today = new Date().toISOString().split('T')[0];
            const dateInput = document.getElementById('absensiDate');
            if (dateInput) dateInput.value = today;
        });
    </script>
</body>
</html>
