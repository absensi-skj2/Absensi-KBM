<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi KBM - SMP Sunan Kalijogo 2 Jabung</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #eef2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .header-card { background: linear-gradient(135deg, #1b5e20, #2e7d32); color: white; border-radius: 16px; }
    .card { border: none; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .siswa-card { transition: all 0.2s ease; border-left: 4px solid #198754; }
    .siswa-card:hover { transform: translateY(-2px); }
    .btn-check:checked + .btn-outline-warning { background-color: #ffc107; color: black; border-color: #ffc107; }
    .btn-check:checked + .btn-outline-secondary { background-color: #6c757d; color: white; border-color: #6c757d; }
    .btn-check:checked + .btn-outline-danger { background-color: #dc3545; color: white; border-color: #dc3545; }
  </style>
</head>
<body class="pb-5">

<div class="container mt-3 mt-md-4" style="max-width: 650px;">
  <!-- Header Card -->
  <div class="card header-card p-3 p-md-4 mb-3 text-center shadow-sm">
    <div class="d-flex justify-content-center align-items-center gap-2 mb-1">
      <i class="fa-solid fa-graduation-cap fa-2x"></i>
      <h4 class="fw-bold mb-0">ABSENSI KBM HARIAN</h4>
    </div>
    <p class="mb-0 small opacity-75">SMP Sunan Kalijogo 2 Jabung</p>
  </div>

  <!-- Form Pengaturan -->
  <div class="card p-3 p-md-4 mb-3">
    <div class="mb-3">
      <label class="form-label fw-bold"><i class="fa-regular fa-calendar me-1"></i> Tanggal KBM</label>
      <input type="date" id="inputTanggal" class="form-control form-control-lg">
    </div>

    <div class="mb-2">
      <label class="form-label fw-bold"><i class="fa-solid fa-users me-1"></i> Pilih Rombel / Kelas</label>
      <select id="selectRombel" class="form-select form-select-lg" onchange="loadDataSiswa()">
        <option value="">-- Memuat Rombel... --</option>
      </select>
    </div>
  </div>

  <!-- Container List Siswa -->
  <div id="containerSiswa" class="card p-3 p-md-4 d-none">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h6 class="fw-bold mb-0 text-success" id="labelDaftarSiswa"><i class="fa-solid fa-list-check me-1"></i> Daftar Siswa</h6>
      <span class="badge bg-success rounded-pill px-3 py-2" id="totalSiswaBadge">0 Siswa</span>
    </div>
    
    <div class="alert alert-success bg-success-subtle border-0 py-2 small mb-3">
      <i class="fa-solid fa-circle-info me-1"></i> Secara otomatis semua siswa dianggap <b>Hadir (H)</b>. Anda cukup memilih siswa yang <b>Sakit (S)</b>, <b>Izin (I)</b>, atau <b>Alpha (A)</b>.
    </div>

    <form id="formAbsensi">
      <div id="listSiswa" class="vstack gap-2"></div>

      <button type="button" class="btn btn-success btn-lg w-100 mt-4 fw-bold py-3 shadow" onclick="kirimAbsensi()">
        <i class="fa-solid fa-paper-plane me-2"></i>SIMPAN ABSENSI HARIAN
      </button>
    </form>
  </div>
</div>

<!-- Modal Loading -->
<div class="modal fade" id="loadingModal" data-bs-backdrop="static" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content text-center p-4 rounded-4 border-0 shadow">
      <div class="spinner-border text-success mx-auto mb-3" style="width: 3rem; height: 3rem;"></div>
      <h6 class="fw-bold mb-0 text-secondary" id="loadingText">Memproses...</h6>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbz0sGY4y4q1uaUCCB2csbzlcwvZeQdgHJzl5X4DGzU69pW1W3WqWECs3cF7AsbHya5X/exec";

  const modalLoading = new bootstrap.Modal(document.getElementById('loadingModal'));

  window.onload = function() {
    document.getElementById('inputTanggal').valueAsDate = new Date();
    loadRombel();
  };

  function showLoading(text) {
    document.getElementById('loadingText').innerText = text;
    modalLoading.show();
  }

  function hideLoading() {
    modalLoading.hide();
  }

  function loadRombel() {
    showLoading("Mengambil Data Rombel...");
    fetch(`${API_URL}?action=getRombel`)
      .then(res => res.json())
      .then(data => {
        hideLoading();
        const select = document.getElementById('selectRombel');
        select.innerHTML = '<option value="">-- Pilih Rombel --</option>';
        data.forEach(r => {
          select.innerHTML += `<option value="${r}">${r}</option>`;
        });
      })
      .catch(err => {
        hideLoading();
        alert("Gagal mengambil data Rombel!");
      });
  }

  function loadDataSiswa() {
    const rombel = document.getElementById('selectRombel').value;
    if (!rombel) {
      document.getElementById('containerSiswa').classList.add('d-none');
      return;
    }

    showLoading("Mengambil Data Siswa...");
    fetch(`${API_URL}?action=getSiswa&rombel=${encodeURIComponent(rombel)}`)
      .then(res => res.json())
      .then(data => {
        hideLoading();
        const listContainer = document.getElementById('listSiswa');
        listContainer.innerHTML = '';
        
        document.getElementById('labelDaftarSiswa').innerText = `Daftar Siswa Kelas ${rombel}`;
        document.getElementById('totalSiswaBadge').innerText = `${data.length} Siswa`;

        data.forEach((s, idx) => {
          const rowHtml = `
            <div class="card p-2 p-md-3 siswa-card d-flex flex-row justify-content-between align-items-center bg-white">
              <div>
                <div class="fw-bold text-dark">${idx+1}. ${s.nama}</div>
                <div class="text-muted small">Induk: ${s.induk} | <span class="badge bg-light text-dark border">${s.pondok}</span></div>
              </div>
              <div class="btn-group btn-group-sm" role="group">
                <input type="radio" class="btn-check" name="ket_${s.nama}" id="s_${idx}" value="S">
                <label class="btn btn-outline-warning fw-bold px-3" for="s_${idx}">S</label>

                <input type="radio" class="btn-check" name="ket_${s.nama}" id="i_${idx}" value="I">
                <label class="btn btn-outline-secondary fw-bold px-3" for="i_${idx}">I</label>

                <input type="radio" class="btn-check" name="ket_${s.nama}" id="a_${idx}" value="A">
                <label class="btn btn-outline-danger fw-bold px-3" for="a_${idx}">A</label>
              </div>
            </div>
          `;
          listContainer.innerHTML += rowHtml;
        });

        document.getElementById('containerSiswa').classList.remove('d-none');
      })
      .catch(err => {
        hideLoading();
        alert("Gagal mengambil data siswa!");
      });
  }

  function kirimAbsensi() {
    const tanggal = document.getElementById('inputTanggal').value;
    const rombel = document.getElementById('selectRombel').value;
    const form = document.getElementById('formAbsensi');
    const formData = new FormData(form);

    const ketidakhadiran = {};
    for (let [key, value] of formData.entries()) {
      const nama = key.replace('ket_', '');
      ketidakhadiran[nama] = value;
    }

    showLoading("Menyimpan Data Absensi...");

    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        tanggal: tanggal,
        rombel: rombel,
        ketidakhadiran: ketidakhadiran
      })
    })
    .then(res => res.json())
    .then(res => {
      hideLoading();
      if(res.success) {
        alert(res.message);
        document.getElementById('selectRombel').value = '';
        document.getElementById('containerSiswa').classList.add('d-none');
      } else {
        alert("Gagal: " + res.message);
      }
    })
    .catch(err => {
      hideLoading();
      alert("Terjadi kesalahan saat menyimpan absensi!");
    });
  }
</script>
</body>
</html>
