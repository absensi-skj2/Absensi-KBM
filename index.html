<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEKOLAHKU - SMP SUNAN KALIJOGO 2 JABUNG</title>
    <!-- Framework CSS Tailwind untuk tampilan profesional, bersih, & sangat scannable -->
    <script src="https://tailwindcss.com"></script>
    <!-- Font Awesome untuk ikon menu utama -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="bg-gray-100 min-h-screen font-sans flex flex-col">

    <!-- HEADER UTAMA APLIKASI -->
    <header class="bg-blue-800 text-white shadow-md p-4">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-wide">SEKOLAHKU</h1>
                <p class="text-xs text-blue-200">SMP SUNAN KALIJOGO 2 JABUNG</p>
            </div>
            <div class="text-right">
                <span class="text-sm font-medium bg-blue-700 px-3 py-1 rounded-full border border-blue-500">
                    <i class="fa-solid fa-user-tie mr-1"></i> Mode Sistem
                </span>
            </div>
        </div>
    </header>

    <!-- PANEL MENU UTAMA -->
    <main class="container mx-auto max-w-5xl flex-grow p-6">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-gray-800">Selamat Datang di Panel Sistem</h2>
            <p class="text-sm text-gray-600 mt-1">Silakan pilih menu utama di bawah ini untuk memulai pengelolaan data.</p>
        </div>

        <!-- GRID LAYOUT 6 MENU UTAMA SESUAI SPESIFIKASI -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            
            <!-- 1. DATA SEKOLAH -->
            <button class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 hover:shadow-md hover:border-blue-500 transition duration-300 text-left flex items-start space-x-4 group">
                <div class="p-4 bg-blue-100 text-blue-700 rounded-xl group-hover:bg-blue-600 group-hover:text-white transition duration-300">
                    <i class="fa-solid fa-school text-2xl w-8 text-center"></i>
                </div>
                <div>
                    <h3 class="font-bold text-gray-800 text-lg group-hover:text-blue-700 transition">DATA SEKOLAH</h3>
                    <p class="text-xs text-gray-500 mt-1">Profil Sekolah, Data Guru & Rombel, Master Data Siswa, & Kalender Pendidikan.</p>
                </div>
            </button>

            <!-- 2. ABSENSI -->
            <button class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 hover:shadow-md hover:border-green-500 transition duration-300 text-left flex items-start space-x-4 group">
                <div class="p-4 bg-green-100 text-green-700 rounded-xl group-hover:bg-green-600 group-hover:text-white transition duration-300">
                    <i class="fa-solid fa-calendar-check text-2xl w-8 text-center"></i>
                </div>
                <div>
                    <h3 class="font-bold text-gray-800 text-lg group-hover:text-green-700 transition">ABSENSI</h3>
                    <p class="text-xs text-gray-500 mt-1">Input absensi harian KBM siswa per rombel & kelola cetak laporan PDF presisi.</p>
                </div>
            </button>

            <!-- 3. CATATAN -->
            <button class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 hover:shadow-md hover:border-amber-500 transition duration-300 text-left flex items-start space-x-4 group">
                <div class="p-4 bg-amber-100 text-amber-700 rounded-xl group-hover:bg-amber-600 group-hover:text-white transition duration-300">
                    <i class="fa-solid fa-clipboard text-2xl w-8 text-center"></i>
                </div>
                <div>
                    <h3 class="font-bold text-gray-800 text-lg group-hover:text-amber-700 transition">CATATAN</h3>
                    <p class="text-xs text-gray-500 mt-1">Pencatatan pelanggaran tatib, poin perkembangan, & catatan khusus siswa.</p>
                </div>
            </button>

            <!-- 4. PENILAIAN -->
            <button class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 hover:shadow-md hover:border-red-500 transition duration-300 text-left flex items-start space-x-4 group">
                <div class="p-4 bg-red-100 text-red-700 rounded-xl group-hover:bg-red-600 group-hover:text-white transition duration-300">
                    <i class="fa-solid fa-graduation-cap text-2xl w-8 text-center"></i>
                </div>
                <div>
                    <h3 class="font-bold text-gray-800 text-lg group-hover:text-red-700 transition">PENILAIAN</h3>
                    <p class="text-xs text-gray-500 mt-1">Input Nilai Harian, Tugas, PTS, PAS, hingga pengolahan rapor berkala.</p>
                </div>
            </button>

            <!-- 5. JURNAL -->
            <button class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 hover:shadow-md hover:border-purple-500 transition duration-300 text-left flex items-start space-x-4 group">
                <div class="p-4 bg-purple-100 text-purple-700 rounded-xl group-hover:bg-purple-600 group-hover:text-white transition duration-300">
                    <i class="fa-solid fa-book text-2xl w-8 text-center"></i>
                </div>
                <div>
                    <h3 class="font-bold text-gray-800 text-lg group-hover:text-purple-700 transition">JURNAL</h3>
                    <p class="text-xs text-gray-500 mt-1">Rekam jejak materi KBM harian guru, kendala kelas, & agenda mengajar harian.</p>
                </div>
            </button>

            <!-- 6. PERANGKAT -->
            <button class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 hover:shadow-md hover:border-teal-500 transition duration-300 text-left flex items-start space-x-4 group">
                <div class="p-4 bg-teal-100 text-teal-700 rounded-xl group-hover:bg-teal-600 group-hover:text-white transition duration-300">
                    <i class="fa-solid fa-folder-open text-2xl w-8 text-center"></i>
                </div>
                <div>
                    <h3 class="font-bold text-gray-800 text-lg group-hover:text-teal-700 transition">PERANGKAT</h3>
                    <p class="text-xs text-gray-500 mt-1">Penyimpanan administrasi guru, silabus, RPP, modul ajar, & kalender akademik.</p>
                </div>
            </button>

        </div>
    </main>

    <!-- FOOTER UTAMA -->
    <footer class="bg-gray-800 text-gray-400 text-center py-4 text-xs border-t border-gray-700 mt-8">
        &copy; 2026 SMP SUNAN KALIJOGO 2 JABUNG. Hak Cipta Dilindungi Undang-Undang.
    </footer>

</body>
</html>
